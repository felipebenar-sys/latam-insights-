name: TRM diaria
on:
  schedule:
    - cron: "7 9 * * *"   # 4:07 a. m. hora Bogotá, antes de la edición de las 5:40
    - cron: "7 23 * * 1-5" # 6:07 p. m. hora Bogotá, cuando ya se certificó la del día siguiente
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trm
jobs:
  trm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot/trm.py
      - run: python3 bot/publicar.py validar
      - name: Commit si cambió
        run: |
          if git diff --quiet data/mercado.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "Stag Research"
          git config user.email "stag-research@users.noreply.github.com"
          git add data/mercado.json
          git commit -m "TRM $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
