name: Pre-revisión de noticias (sin IA)
on:
  schedule:
    - cron: "7 11 * * 1-5"   # 6:07 a. m. hora Bogotá, lunes a viernes, antes de la edición de las 7:10
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: novedades
jobs:
  novedades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet yfinance
      - run: python3 bot/novedades.py
      - name: Commit si cambió
        run: |
          git add data/pendientes.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "Stag Research"
          git config user.email "stag-research@users.noreply.github.com"
          git commit -m "Pre-revisión de noticias $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
